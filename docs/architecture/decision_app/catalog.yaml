app:
  name: decision_app
  status: IMPLEMENTED
  architecture_status: D0_ARCHITECTURE_FREEZE_DA2
  purpose: >-
    Single runtime for causal model evaluation and lane-local authoritative
    decision publication. It does not own canonical market data, risk, sizing,
    stop-loss/take-profit, or execution.
  target_path: src/apps/decision_app
  implementation_status: D9A_D9B_D9C_DA1_DA2
  current_configured_lanes:
    - BTCUSDT:momentum_1h
    - BTCUSDT:momentum_4h
    - ETHUSDT:momentum_4h

contracts:
  canonical_market_data_authority: ingestion
  durable_history: Timescale
  hot_transport: Valkey
  replay_policy: reconstruct_state_suppress_stale_effects
  restart_policy: skip_forward_after_exact_effect_probe
  stale_decision_replay: false
  signal_freshness_seconds: 300
  model_infrastructure_access: false
  dependency_scope: same_decision_lane_only
  dependency_graph: static_acyclic
  authoritative_results: zero_or_one_per_lane_and_market_as_of
  external_data_runtime: inactive
  nonempty_intrinsic_data_requirements: rejected
  decision_price_relay: absent

# Informational mirror only; authoritative numeric defaults remain in
# configs/decision/global.yaml.
runtime_deadlines:
  startup_and_first_generation_seconds: 120
  valkey_command_and_db_acquisition_seconds: 5
  db_operation_seconds: 15
  control_admission_and_drain_seconds: 30
  aggregate_cleanup_seconds: 5
  cleanup_budget: one_lazy_budget_shared_by_one_owner
  startup_failure_cleanup_cap: startup_expiry_plus_cleanup_budget
  borrowed_resource_close: prohibited
  unconfirmed_release: retain_and_fence_reuse

components:
  - name: decision_generation
    role: >-
      Installs ready configured lanes from one startup generation while retaining
      blocked and inactive lane evidence in service status.
    source_of_asset_availability: ingestion_manifest_lifecycle
  - name: bar_store
    role: >-
      Shared bounded causal bar views keyed by lane/timeframe and fed by the
      independent InputReadCursor.
  - name: lane_readiness
    role: >-
      Verifies required canonical inputs and dependencies reach the causal
      market cutoff before evaluation.
  - name: feature_plan
    role: >-
      Computes demand- and operator-policy-approved shared features once per
      relevant lane/as-of, with route-specific history requirements.
  - name: model_execution_plan
    role: >-
      Evaluates the explicit catalog in same-lane topological order and replays
      the same causal chain for stateful reconstruction.
  - name: decision_policy
    role: >-
      Performs lane-local normalization, gating, weighting, freshness checks,
      and zero-or-one authoritative result selection.
  - name: publication
    role: >-
      Publishes deterministic authoritative results with idempotent retry and
      conflict detection.
  - name: lane_effect_skips
    role: >-
      Append-only durable ranges for stale results, restart skip-forward, and
      foreign exact-ID entries; latest effect progress remains compact.

progress:
  input_read_cursor: >-
    Canonical stream-reader position; advances as accepted observations enter the
    shared BarStore and is never held by a model lane.
  lane_commit_watermark: >-
    Per-lane market_as_of committed after publication, final no-signal, or
    publication-suppressed skip together with proposed-state commit.
  effect_progress: >-
    Latest per-lane effect cutoff; NULL disposition means the cutoff advanced
    without a publication effect.
  effect_skips: >-
    Append-only compact skip ranges keyed by lane execution identity and start.

flows:
  - name: live
    steps:
      - ingestion candle
      - InputReadCursor and causal BarStore update
      - lane readiness
      - shared features and same-lane model execution
      - DecisionPolicy and 300-second freshness gate
      - fresh signal/shadow publication or durable stale skip
      - affected LaneCommitWatermark and effect progress commit
  - name: startup
    steps:
      - resolve streams and static graph
      - capture latest trigger cutoff R and validate required history at R
      - probe the exact first unaccounted publication ID
      - rewarm stateful lanes through R with publication suppressed
      - record skipped ranges without replaying stale stateless effects
      - evaluate only the latest stateless cutoff R when fresh
      - consume post-cutoff live events
  - name: shutdown
    steps:
      - admit control and drain effect work within 30 seconds
      - activate one aggregate 5-second cleanup budget
      - close owned resources after quiescence
      - retain and fence ownership when release is unconfirmed
  - name: gap_recovery
    steps:
      - detect exact forward canonical market gap at the input boundary
      - request immediate INPUT_RECONSTRUCTION
      - rebuild generation from Timescale through the existing startup path
      - establish fresh input and lane progress positions
      - resume without stale decision publication
  - name: automatic_recovery
    steps:
      - fail closed for malformed/conflicting input or unsafe lane state
      - retain any already-pending higher-priority rebuild request
      - schedule generation retry with 5-second exponential backoff capped at 300 seconds
      - continue polling healthy lanes during automatic-recovery cooldown
      - retry generation reconstruction and preserve blocked-lane evidence on failure
      - report 503 after more than 300 seconds without a LIVE lane while RUNNING with configured lanes

timing:
  canonical_time_type: timezone_aware_utc_instant
  market_as_of: causal_market_cutoff
  signal_time: market_as_of
  decision_ready_at: runtime_completion_time_for_latency_and_freshness_only
  numeric_unit_inference: prohibited

external_data:
  runtime_enabled: false
  shared_contract_types_retained: true
  nonempty_intrinsic_requirements_rejected: true
  resolver_module: removed
  source_catalog: absent

identity:
  lane_execution_identity:
    - lane_id
    - effective_lane_revision
    - feature_plan_fingerprint
  effective_lane_revision: sha256_lane_base_revision_feature_plan_and_policy
  decision_id: lane_id_plus_effective_lane_revision_plus_market_as_of
  data_plan_fingerprint_column: retained_and_written_as_none

configuration:
  global_file: configs/decision/global.yaml
  current_asset_files:
    - configs/decision/assets/BTC.yaml
    - configs/decision/assets/ETH.yaml
  signal_freshness_seconds: 300
  graph_reload: process_restart_only
  plugin_loading: explicit_catalog

momentum_history_bars:
  BTCUSDT:1h: 136
  BTCUSDT:4h: 272
  ETHUSDT:4h: 544

downstream:
  risk: risk_app
  execution: execution_app
  decision_price_update_stream: absent
  risk_price_continuity: requires_separately_approved_downstream_feed
  risk_profile_identity:
    passthrough: stable_configured_risk_key
    composed: explicit_risk_profile_key
    contributors: metadata_only

resource_target:
  host_memory_gib: 8
  host_cpu_cores: 4
  working_set_class: approximately_5_gib
  cpu_policy: bounded_below_total_saturation
  model_process_per_plugin: false
  uncontrolled_thread_fanout: false
