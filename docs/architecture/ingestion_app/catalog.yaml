app:
  name: ingestion_app
  path: src/apps/ingestion_app
  purpose: >
    Owns exchange ingestion, historical backfill, asset lifecycle control,
    canonical asset manifest publication, and closed-candle distribution for
    downstream consumers.

entrypoints:
  runtime_controller:
    path: src/apps/ingestion_app/main.py
    role: Runtime reconciler and websocket orchestration
  queue_worker:
    path: src/apps/ingestion_app/worker.py
    role: ARQ worker for backfill, purge, cleanup, and polling jobs
  runtime_api:
    path: src/apps/ingestion_app/runtime/app.py
    role: Runtime health and process surface
  ingress_routes:
    path: src/apps/api_app/routers/ingestion.py
    role: Asset lifecycle, ops, status, and scraper bridge routes

features:
  - key: canonical_asset_manifest
    summary: Writes canonical asset and asset-timeframe manifests to Valkey
  - key: lifecycle_streaming
    summary: Publishes normalized asset lifecycle events for downstream apps
  - key: runtime_reconciliation
    summary: Reconciles desired asset state into running websocket runtimes
  - key: websocket_ingestion
    summary: Streams live Binance candles and persists/publishes closed bars
  - key: rest_gap_fill
    summary: Backfills gaps before live and after disconnects
  - key: asset_cleanup
    summary: Purges storage and runtime state for removed assets
  - key: observability_routes
    summary: Exposes catalog, status, events, and ops summary routes
  - key: scraper_bridge
    summary: Proxies internal scraper fetch/job flows for on-demand data pulls

internal_components:
  - name: control_plane
    paths:
      - src/apps/ingestion_app/control_plane/service.py
      - src/apps/ingestion_app/control_plane/publisher.py
      - src/apps/ingestion_app/control_plane/repository.py
      - src/apps/ingestion_app/control_plane/catalog.py
    responsibilities:
      - Persist desired asset state
      - Sync canonical asset manifests
      - Publish ingestion control commands
      - Publish accepted control and lifecycle events

  - name: runtime_reconciler
    paths:
      - src/apps/ingestion_app/runtime/reconciler.py
      - src/apps/ingestion_app/runtime/bootstrap.py
      - src/apps/ingestion_app/runtime/shared.py
    responsibilities:
      - Bootstrap effective assets
      - Watch control-stream changes
      - Start, stop, resume, and remove per-asset runtimes
      - Dispatch purge work for removals

  - name: websocket_pipeline
    paths:
      - src/apps/ingestion_app/runtime/websocket.py
      - src/apps/ingestion_app/adapters/binance_native.py
    responsibilities:
      - Consume live kline feeds
      - Persist OHLCV
      - Publish closed-candle streams
      - Trigger recovery gap-fill jobs

  - name: queue_jobs
    paths:
      - src/apps/ingestion_app/jobs/gap_fill.py
      - src/apps/ingestion_app/jobs/cleanup.py
      - src/apps/ingestion_app/jobs/l2_depth.py
      - src/apps/ingestion_app/jobs/topup.py
    responsibilities:
      - Run REST gap-fill jobs
      - Purge removed assets
      - Poll L2 depth snapshots
      - Top up missing candle data

  - name: observability_routes
    paths:
      - src/apps/api_app/routers/ingestion.py
    responsibilities:
      - Serve effective asset catalog
      - Serve runtime status snapshots
      - Serve recent ingestion events
      - Serve compact operator summaries

tech_stack:
  language: python
  framework:
    - fastapi
    - arq
    - asyncpg
  infra:
    - valkey
    - timescaledb
  adapters:
    - binance_websocket
    - binance_rest
    - ccxt_rest

valkey:
  canonical_keys:
    writes:
      - name: asset:{symbol}
        owner: control_plane
      - name: asset:{symbol}:tf:{timeframe}
        owner: control_plane
    stream:
      - name: asset:lifecycle
        producer: control_plane
        consumers:
          - signal_app
          - strategy_app
  runtime_streams:
    produces:
      - name: stream:control:ingestion
        producer: control_plane
        consumers:
          - runtime_reconciler
      - name: stream:events:ingestion
        producer: control_plane_and_queue_jobs
        consumers:
          - operators
          - future_alert_app
      - name: stream:ohlcv:{symbol}:{timeframe}
        producer: websocket_pipeline
        consumers:
          - signal_app
  runtime_keys:
    writes:
      - name: ingestion:state:{symbol}:{timeframe}
        owner: runtime_reconciler_and_websocket_pipeline
  jobs:
    queue:
      - name: run_rest_gap_fill
        producer: websocket_pipeline_and_runtime_reconciler
        consumer: queue_worker
      - name: purge_removed_asset
        producer: runtime_reconciler
        consumer: queue_worker

database:
  tables:
    owns:
      - name: ingestion_assets
      - name: ohlcv
      - name: ticks
      - name: open_interest
      - name: funding_rate
      - name: l2_depth_features

api:
  routes:
    - method: GET
      path: /ingestion/assets
      purpose: Effective asset catalog
    - method: POST
      path: /ingestion/assets
      purpose: Upsert asset
    - method: POST
      path: /ingestion/assets/batch
      purpose: Batch upsert assets
    - method: POST
      path: /ingestion/assets/batch/action
      purpose: Batch pause stop resume remove
    - method: GET
      path: /ingestion/status
      purpose: Runtime state snapshot
    - method: GET
      path: /ingestion/events
      purpose: Recent ingestion events
    - method: GET
      path: /ingestion/ops-summary
      purpose: Latest operator-focused failure summary

validated_behaviors:
  - initial gap-fill before websocket live handoff
  - closed-candle publication to downstream signal consumers
  - runtime asset add remove flows
  - pause and resume with backfill-before-live semantics
  - canonical lifecycle fan-out to downstream apps
