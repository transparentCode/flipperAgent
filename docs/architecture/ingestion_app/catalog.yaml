app:
  name: ingestion_app
  path: src/apps/ingestion_app
  purpose: >
    Owns exchange ingestion, historical backfill, asset lifecycle control,
    canonical asset manifest publication, runtime reconciliation, and
    closed-candle distribution for downstream consumers.

entrypoints:
  runtime_process:
    path: src/apps/ingestion_app/main.py
    role: Launches runtime app and reconciler process
  runtime_controller:
    path: src/apps/ingestion_app/runtime/app.py
    role: Storage init, coordinator wiring, reconciler lifespan, health surface
  queue_worker:
    path: src/apps/ingestion_app/worker.py
    role: ARQ worker for backfill, purge, cleanup, and polling jobs
  operator_api:
    path: src/apps/api_app/routers/ingestion.py
    role: Asset lifecycle, batch control, ops, status, events, and scraper bridge routes

features:
  - key: canonical_asset_manifest
    summary: Writes canonical asset and asset-timeframe manifests to Valkey
  - key: lifecycle_streaming
    summary: Publishes normalized asset lifecycle events for downstream apps
  - key: desired_state_registry
    summary: Persists desired asset lifecycle state in Timescale-backed registry storage
  - key: runtime_reconciliation
    summary: Reconciles desired asset state into running websocket runtimes
  - key: backfill_before_live
    summary: Performs warmup and resume recovery before promoting runtimes to live
  - key: websocket_ingestion
    summary: Streams live Binance candles and persists/publishes closed bars
  - key: rest_gap_fill
    summary: Backfills gaps before live and after disconnects
  - key: asset_cleanup
    summary: Purges storage and runtime state for removed assets
  - key: observability_routes
    summary: Exposes catalog, status, events, and ops summary routes
  - key: scraper_bridge
    summary: Proxies internal scraper fetch/job flows for on-demand data pulls
  - key: closed_candle_contract
    summary: Uses closed-candle publication as the default downstream trigger surface
  - key: durable_registry_projection_split
    summary: Keeps durable registry truth separate from Valkey runtime projection

architecture_decisions:
  canonical_truth:
    durable_owner:
      kind: timescaledb
      contract: ingestion_assets
    projection_owner:
      kind: valkey
      contracts:
        - asset:{symbol}
        - asset:{symbol}:tf:{timeframe}
        - asset:lifecycle
    rule: Timescale-backed registry is the only durable canonical truth; Valkey is projection and stream distribution and must always be reconstructible from Timescale state.
  candle_semantics:
    default_downstream_trigger: closed_candles_only
    forming_candle_policy: internal_or_explicit_opt_in_only
    provisional_support: optional
    correction_mode: explicit_not_implicit
  lifecycle_idempotency:
    required_identifiers:
      - request_id
      - command_id
      - asset_version
      - timeframe_version
    convergence_rule: Replayed equivalent commands must not create duplicate runtimes or duplicate backfill work.
  source_reconciliation:
    conflict_case: websocket_vs_rest
    precedence: websocket_for_live_closed_candles__rest_for_backfill_and_repair
    requirement: Explicit source precedence and observable correction path.
  downstream_guardrail:
    rule: strategy_app must not bypass risk_app on the path to execution_app.

operational_contracts:
  lifecycle_write_order:
    sequence:
      - persist_timescaledb_registry
      - project_valkey_manifest
      - publish_lifecycle_and_control_streams
    rule: Valkey projection must be reconstructible from durable registry.
  lifecycle_idempotency:
    keys:
      - request_id
      - command_id
      - asset_version
      - timeframe_version
    guarantees:
      - duplicate_enable_requests_do_not_spawn_duplicate_runtimes
      - duplicate_resume_requests_do_not_spawn_duplicate_gap_fill_jobs
      - replayed_batch_requests_converge_to_same_effective_state
  runtime_recovery:
    disconnect_rule: websocket_disconnect_demotes_runtime_to_warming_until_gap_fill_completes_and_live_feed_is_healthy
    restart_rule: process_restart_rebuilds_from_timescaledb_registry_then_reprimes_before_returning_live
    backfill_anchor_rule: recover_from_last_persisted_closed_candle_with_overlap_window
    duplicate_rule: closed_candle_dedupes_on_symbol_timeframe_open_timestamp
    late_data_rule: late_or_corrected_data_uses_explicit_correction_path
    conflict_rule: rest_vs_websocket_source_precedence_must_be_observable
  candle_finality:
    default_trigger: closed_only
    optional_states:
      - provisional
      - corrected_closed
    forming_candle_scope: not_part_of_default_downstream_contract
    downstream_default:
      - signal_app
      - strategy_app
  backtest_live_parity:
    parity_dimensions:
      - timeframe_alignment
      - close_timestamp_convention
      - finality_semantics
      - duplicate_correction_policy
      - source_precedence
      - storage_schema_compatibility
  failure_handling:
    operator_stream: stream:events:ingestion
    terminal_failure_stream: stream:dlq:ingestion
    durable_failure_sink: ingestion_failures
    rule: Silent non-recoverable ingestion failure is not acceptable.
  observability:
    metrics:
      - ws_connected
      - last_candle_lag_seconds
      - gap_fill_pending_count
      - failed_jobs_count
      - duplicate_candle_count
      - runtime_restarts_total
      - candle_publish_latency_ms
    surfaces:
      - prometheus
      - grafana
      - loki_or_structured_logs
      - future_alerting

internal_components:
  - name: control_plane
    paths:
      - src/apps/ingestion_app/control_plane/service.py
      - src/apps/ingestion_app/control_plane/publisher.py
      - src/apps/ingestion_app/control_plane/repository.py
      - src/apps/ingestion_app/control_plane/catalog.py
    responsibilities:
      - Persist desired asset state
      - Sync canonical asset manifests
      - Publish lifecycle events for downstream apps
      - Publish ingestion runtime control commands
      - Publish accepted control and operator events

  - name: runtime_reconciler
    paths:
      - src/apps/ingestion_app/runtime/reconciler.py
      - src/apps/ingestion_app/runtime/bootstrap.py
      - src/apps/ingestion_app/runtime/shared.py
    responsibilities:
      - Bootstrap effective assets
      - Watch control-stream changes
      - Start, stop, resume, and remove per-asset runtimes
      - Coordinate backfill-before-live transitions
      - Dispatch purge and recovery work

  - name: websocket_pipeline
    paths:
      - src/apps/ingestion_app/runtime/websocket.py
      - src/apps/ingestion_app/adapters/binance_native.py
    responsibilities:
      - Consume live kline feeds
      - Persist OHLCV
      - Publish closed-candle streams
      - Keep forming candle handling outside the default downstream trigger contract
      - Write runtime liveness/state
      - Trigger recovery gap-fill jobs on disconnect/gap
      - Enforce candle finality and publication semantics

  - name: queue_jobs
    paths:
      - src/apps/ingestion_app/jobs/gap_fill.py
      - src/apps/ingestion_app/jobs/cleanup.py
      - src/apps/ingestion_app/jobs/l2_depth.py
      - src/apps/ingestion_app/jobs/topup.py
    responsibilities:
      - Run REST gap-fill jobs
      - Purge removed assets
      - Poll L2 depth snapshots
      - Top up missing candle data
      - Repair gaps without violating closed-candle parity semantics

  - name: data_quality_validation
    paths:
      - src/apps/ingestion_app/runtime/websocket.py
      - src/apps/ingestion_app/jobs/gap_fill.py
      - src/apps/ingestion_app/jobs/topup.py
    responsibilities:
      - Enforce timestamp/timeframe alignment
      - Detect duplicate closed-candle conflicts
      - Enforce source-precedence aware correction behavior

  - name: operator_api
    paths:
      - src/apps/api_app/routers/ingestion.py
    responsibilities:
      - Serve effective asset catalog
      - Serve runtime status snapshots
      - Serve recent ingestion events
      - Serve compact operator summaries
      - Bridge on-demand scraper-backed provider requests

tech_stack:
  language: python
  framework:
    - fastapi
    - arq
    - asyncpg
  infra:
    - valkey
    - timescaledb
  adapters:
    - binance_websocket
    - binance_rest
    - ccxt_rest

valkey:
  canonical_keys:
    writes:
      - name: asset:{symbol}
        owner: control_plane
      - name: asset:{symbol}:tf:{timeframe}
        owner: control_plane
    stream:
      - name: asset:lifecycle
        producer: control_plane
        consumers:
          - signal_app
          - strategy_app
  runtime_streams:
    produces:
      - name: stream:control:ingestion
        producer: control_plane
        consumers:
          - runtime_reconciler
      - name: stream:events:ingestion
        producer: control_plane_and_queue_jobs
        consumers:
          - operators
          - alert_app
      - name: asset:status
        producer: coordinator_via_asset_runtime_status_store
      - name: stream:dlq:ingestion
        producer: recommended_future_failure_sink
        consumers:
          - operators
          - future_alert_app
      - name: stream:ohlcv:{symbol}:{timeframe}
        producer: websocket_pipeline
        consumers:
          - signal_app
          - future_backtest_live_parity_auditors
  runtime_keys:
    writes:
      - name: ingestion:state:{symbol}:{timeframe}
        owner: runtime_reconciler_and_websocket_pipeline
      - name: ingestion:runtime_status:{symbol}:{timeframe}
        owner: coordinator_via_asset_runtime_status_store
  jobs:
    queue:
      - name: run_rest_gap_fill
        producer: websocket_pipeline_and_runtime_reconciler
        consumer: queue_worker
      - name: purge_removed_asset
        producer: runtime_reconciler
        consumer: queue_worker
    scheduled:
      - name: poll_l2_depth
        producer: ingestion_scheduler
        consumer: queue_worker
      - name: poll_binance_ohlcv
        producer: ingestion_scheduler
        consumer: queue_worker
      - name: scheduled_gap_fill
        producer: ingestion_scheduler
        consumer: queue_worker
      - name: scheduled_asset_cleanup
        producer: ingestion_scheduler
        consumer: queue_worker

database:
  tables:
    owns:
      - name: ingestion_assets
      - name: ohlcv
      - name: ticks
      - name: open_interest
      - name: funding_rate
      - name: l2_depth_features
    recommended_future:
      - name: ingestion_failures
        purpose: Durable non-recoverable ingestion failure sink and audit history

api:
  routes:
    - method: GET
      path: /ingestion/assets
      purpose: Effective asset catalog
    - method: POST
      path: /ingestion/assets
      purpose: Upsert asset
    - method: POST
      path: /ingestion/assets/batch
      purpose: Batch upsert assets
    - method: POST
      path: /ingestion/assets/batch/action
      purpose: Batch pause stop resume remove
    - method: GET
      path: /ingestion/status
      purpose: Runtime state snapshot
    - method: GET
      path: /ingestion/events
      purpose: Recent ingestion events
    - method: GET
      path: /ingestion/ops-summary
      purpose: Latest operator-focused failure summary
    - method: POST
      path: /ingestion/scraper/fetch
      purpose: Synchronous scraper-backed on-demand provider fetch
    - method: POST
      path: /ingestion/scraper/jobs
      purpose: Queue asynchronous scraper-backed provider fetch
    - method: GET
      path: /ingestion/scraper/jobs/{job_id}
      purpose: Read asynchronous scraper job status/result

validated_behaviors:
  - initial gap-fill before websocket live handoff
  - closed-candle publication to downstream signal consumers
  - canonical truth stored durably and projected into Valkey manifests
  - idempotent lifecycle replay convergence on runtime and backfill behavior
  - runtime asset add remove flows
  - pause and resume with backfill-before-live semantics
  - canonical lifecycle fan-out to downstream apps
  - operator-facing status, event, and ops-summary routes

review_focus:
  explicit_risks_to_review:
    - canonical truth must not split across Timescale and Valkey
    - lifecycle requests need formal idempotency
    - reconnect, restart, duplicate, and late-candle rules must be explicit
    - closed-candle finality is the default downstream trigger contract
    - backtest/live parity must be preserved at candle-schema and semantic level
    - silent failures require DLQ or durable failure storage
    - risk gate must remain between strategy_app and execution_app
