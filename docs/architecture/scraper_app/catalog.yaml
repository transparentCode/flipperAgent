app:
  name: scraper_app
  path: src/apps/scraper_app
  purpose: >
    Always-on collector for TradingView series (hourly) and CoinGlass payloads
    (every 15 minutes, through a contained headless engine). Writes append-only
    observations to the PostgreSQL schema scraper and reports readiness over HTTP.

entrypoints:
  collector:
    path: src/apps/scraper_app/main.py
    role: Starts the singleton, scheduler, TradingView lane, optional CoinGlass lane and health server
  schema_bootstrap:
    path: src/apps/scraper_app/storage/bootstrap.py
    role: Operator step (Compose service scraper-db-bootstrap) that creates schema, role and grants; idempotent

features:
  - key: tradingview_lane
    summary: Reads 20 datasets over the TradingView websocket, gates them and stores bars change-only
  - key: coinglass_lane
    summary: Reads liquidation heatmap and max-pain payloads through CDP on the contained engine
  - key: append_only_store
    summary: Reads, bar observations and payload observations are only inserted; revisions add a seq
  - key: single_instance
    summary: A PostgreSQL advisory lock keeps one writer; a second instance exits non-zero
  - key: retention_purge
    summary: A task in the collector deletes data older than the per-provider retention through the scraper_purge role
  - key: agent_read_api
    summary: Read-only /v2 API (bearer token, own read-only pool) with final, as_of and current bar reads and stored payloads
  - key: readiness
    summary: GET /health/ready returns 200 ready or degraded, 503 not_ready; probed by alert_app

architecture_decisions:
  storage:
    rule: Append-only; a bar is final only after a covering ok read finished at or after bar_close plus the finality horizon.
  containment:
    rule: The engine sits on an internal network and reaches only coinglass.com and coinglasscdn.com through the default-deny proxy.
  failure_isolation:
    rule: A CoinGlass failure never affects the TradingView lane and never makes readiness not_ready.

internal_components:
  - name: settings
    paths:
      - src/apps/scraper_app/settings.py
      - configs/scraper.yaml
  - name: domain
    paths:
      - src/apps/scraper_app/domain/bars.py
      - src/apps/scraper_app/domain/datasets.py
      - src/apps/scraper_app/domain/payloads.py
      - src/apps/scraper_app/domain/errors.py
  - name: adapters
    paths:
      - src/apps/scraper_app/adapters/tradingview
      - src/apps/scraper_app/adapters/coinglass
  - name: runtime
    paths:
      - src/apps/scraper_app/runtime/scheduler.py
      - src/apps/scraper_app/runtime/collector.py
      - src/apps/scraper_app/runtime/coinglass.py
      - src/apps/scraper_app/runtime/singleton.py
      - src/apps/scraper_app/runtime/slots.py
      - src/apps/scraper_app/runtime/purge.py
      - src/apps/scraper_app/runtime/status.py
  - name: storage
    paths:
      - src/apps/scraper_app/storage/repository.py
      - src/apps/scraper_app/storage/bootstrap.py
  - name: http_api
    paths:
      - src/apps/scraper_app/http_api/app.py
      - src/apps/scraper_app/http_api/routes.py
      - src/apps/scraper_app/http_api/v2.py
      - src/apps/scraper_app/http_api/rules.py
      - src/apps/scraper_app/http_api/auth.py
      - src/apps/scraper_app/http_api/catalog.py

tech_stack:
  language: python
  framework:
    - asyncio
    - fastapi
    - websockets
  infra:
    - postgresql
    - tinyproxy
  engine:
    - moli

storage:
  schema: scraper
  tables:
    - scraper.reads
    - scraper.bar_observations
    - scraper.payload_observations

api:
  base_path: /
  routes:
    - GET /health/live
    - GET /health/ready
    - GET /v2/datasets (bearer token)
    - GET /v2/datasets/{id}
    - GET /v2/datasets/{id}/bars
    - GET /v2/datasets/{id}/payload
    - GET /v2/datasets/{id}/payloads
    - GET /v2/datasets/{id}/payloads/{observation_id}

consumers:
  - app: alert_app
    contract: GET http://scraper:8005/health/ready (healthy status ready)
    purpose: health_checks.scraper_collector breach and recovery incidents

diagram: docs/architecture/scraper_app/v2-collector.d2

runtime_services:
  - name: scraper-db-bootstrap
    role: one-shot schema bootstrap (roles scraper_app, scraper_purge)
  - name: scraper
    networks: [flipper-net, scraper-browser-net]
  - name: scraper-browser
    role: Moli headless engine, CDP :9222, internal network only
    build: docker/scraper-browser
  - name: scraper-egress
    role: tinyproxy allow-list for coinglass.com and coinglasscdn.com, CONNECT 443 only
    build: docker/scraper-egress

validated_tests:
  unit_and_integration:
    - tests/scraper
