app:
  name: signal_app
  path: src/apps/signal_app
  purpose: >
    Converts closed OHLCV candles into feature vectors and price updates,
    while reacting to canonical asset lifecycle state published by ingestion.

entrypoints:
  worker_runtime:
    path: src/apps/signal_app/main.py
    role: Bootstraps pairs from asset manifest and starts runtime runner
  runtime_runner:
    path: src/apps/signal_app/runtime/runner.py
    role: Supervises pair workers and lifecycle events
  api:
    path: src/apps/signal_app/api/routes.py
    role: Pair catalog, latest, status, and feature snapshot routes
  cli:
    path: src/apps/signal_app/cli.py
    role: Offline feature snapshot entrypoint

features:
  - key: canonical_bootstrap
    summary: Reads runtime pairs from asset manifest before falling back to config
  - key: lifecycle_subscription
    summary: Watches asset:lifecycle and starts/stops workers per pair
  - key: startup_priming
    summary: Warms indicator state from historical OHLCV before live output
  - key: gap_reprime_fallback
    summary: Re-primes after bar gaps and degrades gracefully on partial history
  - key: live_feature_generation
    summary: Consumes closed candles and emits FeatureVector payloads
  - key: price_updates
    summary: Emits lightweight price-update payloads for risk consumers
  - key: stream_teardown_resilience
    summary: Stops cleanly on removed streams and retries transient broker timeouts
  - key: enrichment_reads
    summary: Reads external market context hashes and optional L2 features
  - key: observability
    summary: Stores runtime status and serves latest/status endpoints
  - key: on_demand_snapshot
    summary: Computes feature snapshots without publishing to streams

internal_components:
  - name: pair_catalog
    paths:
      - src/apps/signal_app/catalog/pairs.py
      - src/apps/signal_app/catalog/static.py
    responsibilities:
      - Resolve effective signal pairs
      - Preserve manifest-first then config fallback behavior

  - name: runtime_runner
    paths:
      - src/apps/signal_app/runtime/runner.py
    responsibilities:
      - Ensure lifecycle consumer group
      - Start and stop pair workers
      - Stop removed workers without deleted-stream error loops
      - Apply asset lifecycle events idempotently

  - name: runtime_worker
    paths:
      - src/apps/signal_app/runtime/worker.py
    responsibilities:
      - Consume closed-candle OHLCV streams
      - Prime history before live
      - Re-prime after bar gaps
      - Degrade gracefully when history is insufficient for full warmup
      - Delegate feature computation and publishing

  - name: feature_pipeline
    paths:
      - src/apps/signal_app/pipeline/features.py
      - src/apps/signal_app/pipeline/raw_indicators.py
      - src/apps/signal_app/pipeline/engineered.py
      - src/apps/signal_app/pipeline/regime.py
      - src/apps/signal_app/pipeline/priming.py
      - src/apps/signal_app/pipeline/snapshot.py
    responsibilities:
      - Compute raw indicators
      - Compute engineered features
      - Attach regime / market-state context
      - Keep live and snapshot paths aligned

  - name: publishers
    paths:
      - src/apps/signal_app/publishing/streams.py
    responsibilities:
      - Publish FeatureVector streams
      - Publish PriceUpdate streams
      - Centralize stream naming and retention

  - name: observability
    paths:
      - src/apps/signal_app/observability/runtime_state.py
      - src/apps/signal_app/observability/status.py
      - src/apps/signal_app/api/routes.py
    responsibilities:
      - Persist runtime status keys
      - Read latest feature entries
      - Serve pair status and latest feature views

valkey:
  canonical_reads:
    hashes:
      - name: asset:{symbol}
        reader: worker_runtime
      - name: asset:{symbol}:tf:{timeframe}
        reader: worker_runtime
    streams:
      - name: asset:lifecycle
        consumer: runtime_runner
        group: signal_app_group
  consumes:
    streams:
      - name: stream:ohlcv:ingestion:{venue}:{instrument_id}:{timeframe}
        consumer: runtime_worker
        group: signal_app_group
  produces:
    streams:
      - name: features:{symbol}:{timeframe}
        producer: publishers
        consumers:
          - strategy_app
      - name: price_update:{symbol}:{timeframe}
        producer: publishers
        consumers:
          - risk_app
  state_keys:
    writes:
      - name: signal:status:{symbol}:{timeframe}
        owner: observability
  enrichment_reads:
    hashes:
      - name: index:latest:{symbol}
      - name: derivatives:latest:{asset}:{suffix}

database:
  reads:
    - name: ohlcv
      usage: priming and snapshot history
    - name: l2_depth_features
      usage: optional regime enrichment

api:
  routes:
    - method: GET
      path: /signal/pairs
      purpose: Effective pair catalog
    - method: GET
      path: /signal/latest
      purpose: Latest FeatureVector by pair
    - method: GET
      path: /signal/status
      purpose: Runtime state and lag by pair
    - method: POST
      path: /signal/features/snapshot
      purpose: On-demand feature computation

validated_behaviors:
  - manifest-first pair discovery
  - lifecycle-driven add remove pause resume worker management
  - feature stream production from closed-candle ingestion inputs
  - removed stream teardown does not loop on NOGROUP
  - gap re-prime degrades instead of poisoning pending work on partial history
  - transient broker read timeouts retry without elevated error noise
  - runtime status persistence and observability reads
