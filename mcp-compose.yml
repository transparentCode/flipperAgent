# On-demand MCP proxy stack for flipperAgent.
# Exposes codebase-memory-mcp and gitnexus as standard MCP HTTP/SSE servers.
# Run with: docker compose -f mcp-compose.yml up -d
# Stop with: docker compose -f mcp-compose.yml down

services:
  mcp-proxy:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9748:9748"
    volumes:
      - cbm-cache:/data/cbm
      - gitnexus-cache:/data/gitnexus
      # Read-write so GitNexus can write its .gitnexus/ index cache inside the repo.
      # Use --index-only to prevent GitNexus from modifying AGENTS.md/CLAUDE.md.
      - .:/workspace
    environment:
      - CBM_CACHE_DIR=/data/cbm
      - HOME=/data/gitnexus
    deploy:
      resources:
        limits:
          # Large code-intelligence backends need memory for graph queries.
          # Full-repo indexing needs more headroom than sub-project indexing.
          memory: 8G
          cpus: '4'
    networks:
      - mcp-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9748/status > /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  cbm-cache:
  gitnexus-cache:

networks:
  mcp-net:
    driver: bridge
