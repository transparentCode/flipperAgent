    db_operation_timeout_seconds: 15
    generation_timeout_seconds: 120
    control_wait_timeout_seconds: 30
    cleanup_timeout_seconds: 5
  signal_publication:
    stream_maxlen: 1000
    stream_approximate: true
  price_relay:
    stream_maxlen: 200
    stream_approximate: true
  shadow_publication:
    stream_maxlen: 1000
    stream_approximate: true
