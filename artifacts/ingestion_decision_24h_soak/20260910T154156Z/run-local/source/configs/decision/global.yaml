decision:
  feature_policy:
    name: momentum-m4
    version: "1"
    allowed_features:
      - MACD
      - RSI
  server:
    host: 0.0.0.0
    port: 8004
  live_input:
    batch_size: 10
    block_ms: 1000
  dependency_io:
