services:
  db:
    image: timescale/timescaledb:latest-pg15
    command: [postgres, -c, max_connections=200]
    environment:
      POSTGRES_USER: d11c_user
      POSTGRES_PASSWORD: d11c_password
      POSTGRES_DB: d11c_db
    ports:
      - "127.0.0.1:${D11C_DB_PORT:?D11C_DB_PORT is required}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 "$${PGDATA}/postmaster.pid" 2>/dev/null)" = "1"
          && pg_isready -U d11c_user -d d11c_db
      interval: 2s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    networks: [d11c-net]

  broker:
    image: valkey/valkey:latest
    command: [valkey-server, --maxmemory, 192mb, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:${D11C_BROKER_PORT:?D11C_BROKER_PORT is required}:6379"
    volumes:
      - d11c-broker-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks: [d11c-net]

  ingestion:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.ingestion_app.main
    ports:
      - "127.0.0.1:${D11C_INGESTION_PORT:?D11C_INGESTION_PORT is required}:8003"
    volumes:
      - ./configs:/app/configs:ro
      - d11c-ingestion-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      POSTGRES_URI: postgresql://d11c_user:d11c_password@db:5432/d11c_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/ingestion.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: ingestion-d11c
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11c-net]

  signal-worker:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.signal_app.main
    volumes:
      - ../../../../configs:/app/configs:ro
      - d11c-signal-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      POSTGRES_URI: postgresql://d11c_user:d11c_password@db:5432/d11c_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/signal.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: signal-d11c
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11c-net]

  strategy-worker:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.strategy_app.main
    volumes:
      - ../../../../configs:/app/configs:ro
      - d11c-strategy-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      NUMBA_CACHE_DIR: /tmp/numba_cache
      NUMBA_DISABLE_JIT: "1"
      POSTGRES_URI: postgresql://d11c_user:d11c_password@db:5432/d11c_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/strategy.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: strategy-d11c
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11c-net]
    stop_signal: SIGINT
    stop_grace_period: 30s

  decision:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.decision_app.main
    ports:
      - "127.0.0.1:${D11C_DECISION_PORT:?D11C_DECISION_PORT is required}:8004"
    volumes:
      - ../../../../configs:/app/configs:ro
      - d11c-decision-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      POSTGRES_URI: postgresql://d11c_user:d11c_password@db:5432/d11c_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/decision.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: decision-d11c
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 20s
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11c-net]
    stop_signal: SIGINT

  risk-worker:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.risk_app.main
    volumes:
      - ../../../../configs:/app/configs:ro
      - d11c-risk-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      POSTGRES_URI: postgresql://d11c_user:d11c_password@db:5432/d11c_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/risk.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: risk-d11c
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11c-net]

  execution-worker:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.execution_app.main
    volumes:
      - ../../../../configs:/app/configs:ro
      - d11c-execution-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      POSTGRES_URI: postgresql://d11c_user:d11c_password@db:5432/d11c_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/execution.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: execution-d11c
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11c-net]

volumes:
  d11c-broker-data:
  d11c-ingestion-logs:
  d11c-signal-logs:
  d11c-strategy-logs:
  d11c-decision-logs:
  d11c-risk-logs:
  d11c-execution-logs:

networks:
  d11c-net:
