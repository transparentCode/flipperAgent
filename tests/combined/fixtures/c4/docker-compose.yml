services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: c4_user
      POSTGRES_PASSWORD: c4_password
      POSTGRES_DB: c4_db
    ports:
      - "127.0.0.1:${C4_DB_PORT:?C4_DB_PORT is required}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 "$${PGDATA}/postmaster.pid" 2>/dev/null)" = "1"
          && pg_isready -U c4_user -d c4_db
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [c4-net]

  broker:
    image: valkey/valkey:latest
    command:
      - valkey-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${C4_BROKER_PORT:?C4_BROKER_PORT is required}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [c4-net]

  decision:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.decision_app.main
    ports:
      - "127.0.0.1:${C4_DECISION_PORT:?C4_DECISION_PORT is required}:8004"
    volumes:
      - ../../../../configs/base.yaml:/app/configs/base.yaml:ro
      - ../../../../configs/ingestion:/app/configs/ingestion:ro
      - ./decision:/app/configs/decision:ro
      - c4-logs:/app/logs
    tmpfs:
      - /tmp
    environment:
      POSTGRES_URI: postgresql://c4_user:c4_password@db:5432/c4_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/decision.log
      LOG_FORMAT: json
      OTEL_SERVICE_NAME: decision
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=2)",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks: [c4-net]

volumes:
  c4-logs:

networks:
  c4-net:
