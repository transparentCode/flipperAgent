services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: d11b_user
      POSTGRES_PASSWORD: d11b_password
      POSTGRES_DB: d11b_db
    ports:
      - "127.0.0.1:${D11B_DB_PORT:?D11B_DB_PORT is required}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 "$${PGDATA}/postmaster.pid" 2>/dev/null)" = "1"
          && pg_isready -U d11b_user -d d11b_db
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [d11b-net]

  broker:
    image: valkey/valkey:latest
    command: [valkey-server, --maxmemory, 192mb, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:${D11B_BROKER_PORT:?D11B_BROKER_PORT is required}:6379"
    volumes:
      - d11b-broker-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [d11b-net]

  signal-worker:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.signal_app.main
    volumes:
      - ../../../../configs:/app/configs:ro
      - d11b-signal-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      POSTGRES_URI: postgresql://d11b_user:d11b_password@db:5432/d11b_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/signal.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: signal-d11b
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11b-net]

  strategy-worker:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.strategy_app.main
    volumes:
      - ../../../../configs/base.yaml:/app/configs/base.yaml:ro
      - ../../../../configs/features.yaml:/app/configs/features.yaml:ro
      - ../../../../configs/selection.yaml:/app/configs/selection.yaml:ro
      - ${D11B_STRATEGY_MODELS_FILE:?D11B_STRATEGY_MODELS_FILE is required}:/app/configs/models.yaml:ro
      - d11b-strategy-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      NUMBA_CACHE_DIR: /tmp/numba_cache
      NUMBA_DISABLE_JIT: "1"
      POSTGRES_URI: postgresql://d11b_user:d11b_password@db:5432/d11b_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/strategy.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: strategy-d11b
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11b-net]
    stop_signal: SIGINT
    stop_grace_period: 30s

  decision:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.decision_app.main
    ports:
      - "127.0.0.1:${D11B_DECISION_PORT:?D11B_DECISION_PORT is required}:8004"
    volumes:
      - ../../../../configs/base.yaml:/app/configs/base.yaml:ro
      - ../../../../configs/ingestion:/app/configs/ingestion:ro
      - ../../../../configs/decision:/app/configs/decision:ro
      - d11b-decision-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      POSTGRES_URI: postgresql://d11b_user:d11b_password@db:5432/d11b_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/decision.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: decision-d11b
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11b-net]
    stop_signal: SIGINT

  risk-worker:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.risk_app.main
    volumes:
      - ../../../../configs:/app/configs:ro
      - d11b-risk-logs:/app/logs
    tmpfs: [/tmp]
    environment:
      POSTGRES_URI: postgresql://d11b_user:d11b_password@db:5432/d11b_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/risk.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: risk-d11b
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d11b-net]

volumes:
  d11b-broker-data:
  d11b-signal-logs:
  d11b-strategy-logs:
  d11b-decision-logs:
  d11b-risk-logs:

networks:
  d11b-net:
