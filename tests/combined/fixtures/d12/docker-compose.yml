services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: d12_user
      POSTGRES_PASSWORD: d12_password
      POSTGRES_DB: d12_db
    ports:
      - "127.0.0.1:${D12_DB_PORT:?D12_DB_PORT is required}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 "$${PGDATA}/postmaster.pid" 2>/dev/null)" = "1"
          && pg_isready -U d12_user -d d12_db
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [d12-net]

  broker:
    image: valkey/valkey:latest
    command: [valkey-server, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:${D12_BROKER_PORT:?D12_BROKER_PORT is required}:6379"
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [d12-net]

  ingestion:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.ingestion_app.main
    ports:
      - "127.0.0.1:${D12_INGESTION_PORT:?D12_INGESTION_PORT is required}:8003"
    volumes:
      - ../../../../configs/base.yaml:/app/configs/base.yaml:ro
      - ./configs/ingestion-runtime/global.yaml:/app/configs/ingestion/global.yaml:ro
      - ./configs/ingestion-runtime/assets:/app/configs/ingestion/assets:ro
      - d12-ingestion-logs:/app/logs
    environment:
      POSTGRES_URI: postgresql://d12_user:d12_password@db:5432/d12_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/ingestion.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: ingestion-d12
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test:
        [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d12-net]

  decision:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.decision_app.main
    ports:
      - "127.0.0.1:${D12_DECISION_PORT:?D12_DECISION_PORT is required}:8004"
    volumes:
      - ../../../../configs/base.yaml:/app/configs/base.yaml:ro
      - ./configs/ingestion-decision/global.yaml:/app/configs/ingestion/global.yaml:ro
      - ./configs/ingestion-decision/assets:/app/configs/ingestion/assets:ro
      - ./decision:/app/configs/decision:ro
      - d12-decision-logs:/app/logs
    environment:
      POSTGRES_URI: postgresql://d12_user:d12_password@db:5432/d12_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/decision.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: decision-d12
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test:
        [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 20s
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d12-net]

  risk-worker:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.risk_app.main
    volumes:
      - ../../../../configs/base.yaml:/app/configs/base.yaml:ro
      - ./configs/risk.yaml:/app/configs/risk.yaml:ro
      - d12-risk-logs:/app/logs
    environment:
      POSTGRES_URI: postgresql://d12_user:d12_password@db:5432/d12_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/risk.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: risk-d12
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d12-net]

  execution-worker:
    build:
      context: ../../../../
      dockerfile: Dockerfile
    command: python -m apps.execution_app.main
    volumes:
      - ../../../../configs/base.yaml:/app/configs/base.yaml:ro
      - ./configs/execution.yaml:/app/configs/execution.yaml:ro
      - ./configs/risk.yaml:/app/configs/risk.yaml:ro
      - d12-execution-logs:/app/logs
    environment:
      POSTGRES_URI: postgresql://d12_user:d12_password@db:5432/d12_db
      VALKEY_URI: redis://broker:6379/0
      LOG_FILE: /app/logs/execution.log
      LOG_FORMAT: json
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_NAME: execution-d12
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks: [d12-net]

volumes:
  d12-ingestion-logs:
  d12-decision-logs:
  d12-risk-logs:
  d12-execution-logs:

networks:
  d12-net:
