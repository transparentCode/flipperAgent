risk:
  runtime:
    signal_routes:
      - BTCUSDT:1h
      - BTCUSDT:4h
      - ETHUSDT:4h
  account:
    initial_balance: 10000
    currency: USDT
  global_limits:
    max_total_exposure_pct: 80
    max_concurrent_positions: 10
    max_drawdown_pct: 100
    daily_loss_limit_pct: 100
    cooldown_after_loss_seconds: 0
  rules: []
  position_sizing:
    default_strategy: equal_weight
    equal_weight: {}
  stop_loss:
    default_method: fixed_pct
    fixed_pct:
      pct: 2.0
  take_profit:
    default_method: risk_reward
    risk_reward:
      ratio: 2.0
  mtf:
    default_conflict_resolution: conviction_weighted
    signal_timeout_seconds: 0
    timeframe_weights:
      1h: 1.0
      4h: 1.5
  assets:
    default:
      max_position_pct: 20
      signal_handling: aggregate
    BTCUSDT: {}
    ETHUSDT: {}
