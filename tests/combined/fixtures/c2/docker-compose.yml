services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: c2_user
      POSTGRES_PASSWORD: c2_password
      POSTGRES_DB: c2_db
    volumes:
      - c2-timescaledb-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${C2_DB_PORT:?C2_DB_PORT is required}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 "$${PGDATA}/postmaster.pid" 2>/dev/null)" = "1"
          && pg_isready -U c2_user -d c2_db
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - c2-net

  broker:
    image: valkey/valkey:latest
    command:
      - valkey-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - c2-valkey-data:/data
    ports:
      - "127.0.0.1:${C2_BROKER_PORT:?C2_BROKER_PORT is required}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - c2-net

volumes:
  c2-timescaledb-data:
  c2-valkey-data:

networks:
  c2-net:
