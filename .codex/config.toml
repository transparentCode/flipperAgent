# Project-scoped Codex defaults. MCP names mirror .vscode/mcp.json.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.hindsight]
url = "http://localhost:8888/mcp"
required = false
default_tools_approval_mode = "writes"
enabled_tools = [
  "list_banks",
  "get_bank",
  "get_bank_stats",
  "create_bank",
  "sync_retain",
  "recall",
  "reflect",
  "list_memories",
  "get_memory",
]

[mcp_servers.codebase-memory-mcp]
url = "http://localhost:9748/mcp"
required = false
default_tools_approval_mode = "auto"
enabled_tools = [
  "list_projects",
  "index_status",
  "search_graph",
  "search_code",
  "trace_path",
  "get_code_snippet",
  "query_graph",
  "get_graph_schema",
  "get_architecture",
  "detect_changes",
]

[mcp_servers.codebase-memory-mcp.tools.search_graph]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.get_architecture]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.search_code]
approval_mode = "approve"

[mcp_servers.gitnexus]
url = "http://localhost:9750/mcp"
required = false
default_tools_approval_mode = "auto"
enabled_tools = [
  "context",
  "impact",
  "trace",
  "cypher",
  "detect_changes",
  "group_list",
  "list_repos",
  "query",
  "check",
  "explain",
  "pdg_query",
  "route_map",
  "tool_map",
  "shape_check",
  "api_impact",
]

[sandbox_workspace_write]
network_access = true

[agents]
max_concurrent_threads_per_session = 2
interrupt_message = true
