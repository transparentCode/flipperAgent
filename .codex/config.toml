# Project-scoped Codex defaults. MCP names mirror .vscode/mcp.json.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.mem0-local]
url = "http://localhost:8889/mcp"
required = false
default_tools_approval_mode = "writes"

[mcp_servers.codebase-memory-mcp]
url = "http://localhost:9747/mcp/cbm"
required = false
default_tools_approval_mode = "auto"
enabled_tools = [
  "list_projects",
  "index_status",
  "index_repository",
  "search_graph",
  "search_code",
  "trace_path",
  "get_code_snippet",
  "query_graph",
  "get_graph_schema",
  "get_architecture",
  "detect_changes",
]

[mcp_servers.gitnexus]
url = "http://localhost:9747/mcp/gitnexus"
required = false
default_tools_approval_mode = "auto"
enabled_tools = [
  "mcp_gitnexus_context",
  "mcp_gitnexus_impact",
  "mcp_gitnexus_trace_path",
  "mcp_gitnexus_cypher",
  "mcp_gitnexus_detect_changes",
  "mcp_gitnexus_group_list",
  "mcp_gitnexus_list_repos",
]

[sandbox_workspace_write]
network_access = false

[agents]
max_threads = 3
max_depth = 1
interrupt_message = true
