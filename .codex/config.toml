# Project-scoped Codex defaults. MCP names mirror .vscode/mcp.json.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.mem0-local]
url = "http://localhost:8889/mcp"
required = false
default_tools_approval_mode = "writes"
enabled_tools = [
  "add_memory",
  "search_memories",
  "get_memories",
  "get_memory",
  "update_memory",
  "delete_memory",
  "delete_all_memories",
  "list_entities",
  "delete_entities",
]

[mcp_servers.codebase-memory-mcp]
url = "http://localhost:9748/servers/cbm/mcp"
required = false
default_tools_approval_mode = "auto"
enabled_tools = [
  "list_projects",
  "index_status",
  "index_repository",
  "search_graph",
  "search_code",
  "trace_path",
  "get_code_snippet",
  "query_graph",
  "get_graph_schema",
  "get_architecture",
  "detect_changes",
  "delete_project",
  "manage_adr",
  "ingest_traces",
]

[mcp_servers.gitnexus]
url = "http://localhost:9748/servers/gitnexus/mcp"
required = false
default_tools_approval_mode = "auto"
enabled_tools = [
  "context",
  "impact",
  "trace",
  "cypher",
  "detect_changes",
  "group_list",
  "list_repos",
  "query",
  "check",
  "rename",
  "explain",
  "pdg_query",
  "route_map",
  "tool_map",
  "shape_check",
  "api_impact",
  "group_sync",
]

[mcp_servers.caveman-shrink]
url = "http://localhost:9748/servers/caveman-shrink/mcp"
required = false
default_tools_approval_mode = "auto"
enabled_tools = [
  "list_projects",
  "index_status",
  "index_repository",
  "search_graph",
  "search_code",
  "trace_path",
  "get_code_snippet",
  "query_graph",
  "get_graph_schema",
  "get_architecture",
  "detect_changes",
  "delete_project",
  "manage_adr",
  "ingest_traces",
]

[mcp_servers.gitnexus-shrink]
url = "http://localhost:9748/servers/gitnexus-shrink/mcp"
required = false
default_tools_approval_mode = "auto"
enabled_tools = [
  "context",
  "impact",
  "trace",
  "cypher",
  "detect_changes",
  "group_list",
  "list_repos",
  "query",
  "check",
  "rename",
  "explain",
  "pdg_query",
  "route_map",
  "tool_map",
  "shape_check",
  "api_impact",
  "group_sync",
]

[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 3
max_depth = 1
interrupt_message = true
