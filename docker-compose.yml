services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flipper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flipperpass}
      POSTGRES_DB: ${POSTGRES_DB:-flipper_db}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flipper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    networks:
      - flipper-net

  broker:
    image: valkey/valkey:latest
    volumes:
      - valkey-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - flipper-net

  worker-queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: arq apps.ingestion_app.orchestration.worker.WorkerSettings
    volumes:
      - ./data:/app/data
    tmpfs:
      - /app/logs
      - /tmp
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-flipper}:${POSTGRES_PASSWORD:-flipperpass}@db:5432/${POSTGRES_DB:-flipper_db}
      VALKEY_URI: redis://broker:6379/0
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - flipper-net

  worker-streams:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m apps.ingestion_app.main
    ports:
      - "8002:8001"
    volumes:
      - ./data:/app/data
    tmpfs:
      - /app/logs
      - /tmp
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-flipper}:${POSTGRES_PASSWORD:-flipperpass}@db:5432/${POSTGRES_DB:-flipper_db}
      VALKEY_URI: redis://broker:6379/0
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - flipper-net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity # placeholder cron dispatcher
    volumes:
      - ./data:/app/data
    tmpfs:
      - /app/logs
      - /tmp
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-flipper}:${POSTGRES_PASSWORD:-flipperpass}@db:5432/${POSTGRES_DB:-flipper_db}
      VALKEY_URI: redis://broker:6379/0
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - flipper-net

  strategy-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m apps.strategy_app.main
    volumes:
      - ./data:/app/data
    tmpfs:
      - /app/logs
      - /tmp
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-flipper}:${POSTGRES_PASSWORD:-flipperpass}@db:5432/${POSTGRES_DB:-flipper_db}
      VALKEY_URI: redis://broker:6379/0
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
