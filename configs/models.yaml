models:
  assets:
    BTCUSDT:
      timeframes:
        1h:
          MeanReversion:
            enabled: true
            migration_mode: scoring
            params:
              rsi_scale: 15.0
              w_rsi: 0.4
              w_bb: 0.4
              w_kama: 0.2
              adx_center: 25.0
              adx_steepness: 5.0
          TrendFollowing:
            enabled: false  # Deprecated: negative Sharpe even after 300-trial NSGA-II optimization
            params:
              ema_fast_period: 10
              ema_slow_period: 49
              require_macd_confirm: true
              atr_conviction_scale: 0.9
          Momentum:
            enabled: true
            # Optimized 2yr multi-TP: Sharpe +0.94, WR 64%, 315 trades
            params:
              rsi_long_threshold: 70
              rsi_short_threshold: 34
              require_macd_positive: true
              histogram_min_abs: 0.7
          SqueezeBreakout:
            enabled: true
            migration_mode: adapted
            comparison_logging: true
            # 3-param reduced grid: PBO=0.46 GO, Sharpe +1.43 (vs defaults +0.89, v7 +0.26)
            params:
              kama_fast_period: 10
              kama_slow_period: 25
              mom_period: 30
              squeeze_lookback: 1
              ss_threshold: 3
              cci_period: 5
              adx_period: 14
              adx_threshold: 18
              ad_sma_period: 21
              mfi_period: 14
              mfi_sma_period: 9
              mom_lr_period: 14
              mom_lr_mom_period: 10
          PriceAction:
            enabled: true
            migration_mode: scoring
            params:
              swing_lookback: 5
          KyleTFI:
            enabled: true
            params:
              kyle_smooth: 24
              kyle_lookback: 200
              informed_z_threshold: 1.25
              tfi_z_long: 1.0
              tfi_z_short: -1.0
              atr_tp_mult: 3.0
              atr_sl_mult: 2.0
          VPINKyle:
            enabled: true
            params:
              vpin_z_threshold: 1.25
              kyle_z_threshold: 1.0
              buy_ratio_long: 0.58
              buy_ratio_short: 0.42
              atr_tp_mult: 2.0
              atr_sl_mult: 1.5
        4h:
          MeanReversion:
            enabled: true
            migration_mode: scoring
            params:
              rsi_scale: 15.0
              w_rsi: 0.4
              w_bb: 0.4
              w_kama: 0.2
              adx_center: 25.0
              adx_steepness: 5.0
          TrendFollowing:
            enabled: false  # Deprecated: structurally negative for crypto
            params:
              ema_fast_period: 14
              ema_slow_period: 20
              require_macd_confirm: false
              atr_conviction_scale: 1.6
          Momentum:
            enabled: true
            # Optimized 2yr multi-TP: Sharpe +0.28, WR 62%, 225 trades
            params:
              rsi_long_threshold: 61
              rsi_short_threshold: 37
              require_macd_positive: true
              histogram_min_abs: 0.35
          SqueezeBreakout:
            enabled: false
    ETHUSDT:
      timeframes:
        4h:
          MeanReversion:
            enabled: true
            migration_mode: scoring
            params:
              rsi_scale: 15.0
              w_rsi: 0.4
              w_bb: 0.4
