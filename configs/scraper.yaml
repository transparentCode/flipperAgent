      revision_watch_seconds: 1036800
    - id: tv.cryptocap.total3.1d
      request_symbol: "CRYPTOCAP:TOTAL3"
      canonical_symbol: "CRYPTOCAP:TOTAL3"
      interval: "1D"
      shape: ohlcv
