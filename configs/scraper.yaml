      revision_watch_seconds: 1036800
    - id: tv.cryptocap.total3es.1h
      request_symbol: "CRYPTOCAP:TOTAL3ES"
      canonical_symbol: "CRYPTOCAP:TOTAL3ES"
      interval: "1h"
      shape: ohlcv
      contiguous: true
