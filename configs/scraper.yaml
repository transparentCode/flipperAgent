    # Binance perpetual open interest: request alias resolves to the canonical .P_OI name.
    # Not final at close: BNB and SOL bars were revised 9-21 h later (2026-10-09).
    - id: tv.binance.btcusdt_p.oi.1h
      request_symbol: "BINANCE:BTCUSDTPERP_OI"
      canonical_symbol: "BINANCE:BTCUSDT.P_OI"
