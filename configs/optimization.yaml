optimization:
  defaults:
    n_trials: 200
    write_back: false
    walk_forward:
      train_ratio: 0.60
      val_ratio: 0.20
      oos_ratio: 0.20
      purge_bars: 24
    convergence_patience: 50
    two_stage:
      screening_trials: 50
      importance_threshold: 0.05
      oos_sharpe_ratio: 0.50
      seed: 42

  schedules:
    MeanReversion:
      cron: "0 2 * * 1"           # weekly Monday 2am UTC
      assets: ["BTCUSDT", "ETHUSDT"]
      timeframes: ["1h", "4h"]
      write_back: true
    TrendFollowing:
      cron: "0 3 1 * *"           # monthly 1st 3am UTC
      assets: ["BTCUSDT"]
      timeframes: ["4h"]
      write_back: true
    Momentum:
      cron: "0 2 */14 * *"        # biweekly
      assets: ["BTCUSDT", "ETHUSDT"]
      timeframes: ["4h"]
      write_back: true
    RegimePullbackScorer:
      cron: "0 4 1 * *"           # monthly 1st 4am UTC
      assets: ["BTCUSDT"]
      timeframes: ["1h"]
      write_back: false
    DivergenceEdgeScorer:
      cron: "0 5 1 * *"           # monthly 1st 5am UTC
      assets: ["BTCUSDT"]
      timeframes: ["1h"]
      write_back: false
