logging:
  level: INFO
  console_format: json

conductor:
  runtime:
    plans_dir: plans
    conductor_dir: .conductor
    squad_db: .squad/messages.db
    squad_binary: squad
    log_level: INFO
    default_local_roles:
      - orchestrator
      - researcher
      - architect
      - coder
      - reviewer
    default_remote_roles:
      - remote_planner
      - remote_reviewer
      - remote_approval
    agent_commands:
      orchestrator: [.venv/bin/python, conductor/scripts/opencode_wrapper.py]
      researcher: [.venv/bin/python, conductor/scripts/opencode_wrapper.py]
      architect: [.venv/bin/python, conductor/scripts/opencode_wrapper.py]
      coder: [.venv/bin/python, conductor/scripts/codex_wrapper.py]
      reviewer: [.venv/bin/python, conductor/scripts/opencode_wrapper.py]
      approval: [stub]
  workflow:
    role_for_stage:
      intake: orchestrator
      research: researcher
      architect: architect
      code: coder
      review: reviewer
      approval: approval
    transitions:
      next_stage:
        intake: research
        research: architect
        architect: code
        code: review
        review: approval
        approval: done
        done: done
      gate_stage_for:
        architect: human_ready
        review: human_review
      gate_target:
        human_ready: code
        human_review: approval
      retry_stage:
        review: code
        approval: architect
        code: architect
      retry_stage_for_gate:
        human_ready: architect
        human_review: code
    stub_stage_transitions:
      architect: code
      coder: review
      reviewer: approval
      approval: done
  remote:
    poll_seconds: 30
    timeout_seconds: 86400
    roles:
      - remote_planner
      - remote_reviewer
      - remote_approval
  human_gates:
    before_code: true
    before_approval: true
    auto_advance_low_risk_architect_pass: false
    auto_advance_low_risk_review_pass: false
    force_human_if_changed_paths:
      - src/libs/execution
      - src/libs/risk
      - src/libs/order
      - src/libs/models/regime
      - src/libs/models/regime_v2
      - src/libs/models/regime_prob
      - src/libs/optimizer
    force_human_if_keywords:
      - live
      - order
      - position_size
      - leverage
      - risk
      - promotion
      - optimizer
      - walk_forward
      - oos
      - lookahead
      - leakage
  timeouts:
    queued_timeout_seconds: 300
    ack_timeout_seconds: 600
    soft_timeout_seconds: 1800
    hard_timeout_seconds: 3600
    remote_timeout_seconds: 86400
    checkpoint_grace_seconds: 300
    max_stall_count: 2
    max_retry_count: 2
    stage_timeouts:
      INTAKE:
        soft_timeout_seconds: 900
        hard_timeout_seconds: 1800
      ARCHITECT:
        soft_timeout_seconds: 1800
        hard_timeout_seconds: 3600
      CODE:
        soft_timeout_seconds: 3600
        hard_timeout_seconds: 7200
      REVIEW:
        soft_timeout_seconds: 1800
        hard_timeout_seconds: 3600
      APPROVAL:
        soft_timeout_seconds: 86400
        hard_timeout_seconds: null

ingestion:
  credentials:
    api_key: ""
    api_secret: ""
  assets:
    default_binance_asset: BTCUSDT
    historical_backfill_days: 2
    target_list:
    - BTCUSDT
    - ETHUSDT
    - XRPUSDT
    - SOLUSDT
    - BNBUSDT
    - DOGEUSDT
    publish_timeframes:
      BTCUSDT: ["30m","1h", "4h"]
      ETHUSDT: ["30m","1h", "4h"]  # standby — ETHUSDT/1d not configured; no model consumer for 30m, 1h
      XRPUSDT: ["30m","1h", "4h"]
      SOLUSDT: ["30m","1h", "4h"]  # standby — SOLUSDT/15m not configured; no model consumer for 30m, 4h
      BNBUSDT: ["30m","1h", "4h"]
      DOGEUSDT: ["30m","1h", "4h"]
  concurrency:
    gap_fill_limit: 5
    gap_fill_sleep_seconds: 0.5
    worker_job_timeout: 300
    worker_max_jobs: 20
  orchestration:
    schedules:
      funding_hours:
      - 0
      - 4
      - 8
      - 12
      - 16
      - 20
      funding_timeout: 60
      gap_fill_minutes:
      - 0
      - 5
      - 10
      - 15
      - 20
      - 25
      - 30
      - 35
      - 40
      - 45
      - 50
      - 55
      gap_fill_timeout: 300
      ohlcv_minutes:
      - 0
      - 15
      - 30
      - 45
      ohlcv_timeout: 120
      l2_depth_minutes:
      - 0
      - 5
      - 10
      - 15
      - 20
      - 25
      - 30
      - 35
      - 40
      - 45
      - 50
      - 55
      l2_depth_timeout: 60
  retry:
    max_attempts: 5
    max_seconds: 60
    min_seconds: 4
    multiplier: 1
  streams:
    control_maxlen: 1000
    control_approximate: true
    events_maxlen: 1000
    events_approximate: true
    lifecycle_maxlen: 1000
    lifecycle_approximate: true
    runtime_status_maxlen: 1000
    runtime_status_approximate: true
    ohlcv_maxlen: 1000
    ohlcv_approximate: true
  server:
    host: 0.0.0.0
    port: 8001
  timeframes:
    base_gap_fill: 1m
    binance_stream_interval: 1m
    default: 15m

  l2_depth:
    snapshot_levels: 20      # Binance depth limit (5, 10, 20, 50, 100)
    top_n_imbalance: 5       # levels for imbalance computation

  websocket:
    stream_url: wss://fstream.binancefuture.com
    queue_drop_warning_every: 100
    queue_maxsize: 1000
    reconnect_sleep_seconds: 5
    verification_sleep_seconds: 10
    warmup_threshold_ms: 300000
    warmup_timeout_seconds: 600
postgres:
  database: flipper_db
  host: localhost
  password: flipperpass
  pool:
    max_size: 10
    min_size: 2
  port: 5432
  user: flipper
valkey:
  uri: redis://localhost:6379/0

scraper_service:
  host: 0.0.0.0
  port: 8081
  job_ttl_seconds: 3600

signal:
  runtime:
    feature_stream_maxlen: 1000
    feature_stream_approximate: true
    price_update_stream_maxlen: 200
    price_update_stream_approximate: true
    ltf_context_ttl_seconds: 21600

risk:
  runtime:
    order_stream_maxlen: 1000
    order_stream_approximate: true

execution:
  runtime:
    fill_stream_maxlen: 1000
    fill_stream_approximate: true
    failure_stream_maxlen: 1000
    failure_stream_approximate: true
