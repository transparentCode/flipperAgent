logging:
  level: INFO
  console_format: json

ingestion:
  credentials:
    api_key: ""
    api_secret: ""
  assets:
    default_binance_asset: BTCUSDT
    historical_backfill_days: 2
    target_list:
    - BTCUSDT
    - ETHUSDT
    - XRPUSDT
    - SOLUSDT
    - BNBUSDT
    - DOGEUSDT
    publish_timeframes:
      BTCUSDT: ["30m","1h", "4h"]
      ETHUSDT: ["30m","1h", "4h"]  # standby — ETHUSDT/1d not configured; no model consumer for 30m, 1h
      XRPUSDT: ["30m","1h", "4h"]
      SOLUSDT: ["30m","1h", "4h"]  # standby — SOLUSDT/15m not configured; no model consumer for 30m, 4h
      BNBUSDT: ["30m","1h", "4h"]
      DOGEUSDT: ["30m","1h", "4h"]
  concurrency:
    gap_fill_limit: 5
    gap_fill_sleep_seconds: 0.5
    worker_job_timeout: 300
    worker_max_jobs: 20
  orchestration:
    schedules:
      funding_hours:
      - 0
      - 4
      - 8
      - 12
      - 16
      - 20
      funding_timeout: 60
      gap_fill_minutes:
      - 0
      - 5
      - 10
      - 15
      - 20
      - 25
      - 30
      - 35
      - 40
      - 45
      - 50
      - 55
      gap_fill_timeout: 300
      ohlcv_minutes:
      - 0
      - 15
      - 30
      - 45
      ohlcv_timeout: 120
  retry:
    max_attempts: 5
    max_seconds: 60
    min_seconds: 4
    multiplier: 1
  server:
    host: 0.0.0.0
    port: 8001
  timeframes:
    base_gap_fill: 1m
    binance_stream_interval: 1m
    default: 15m

  websocket:
    stream_url: wss://fstream.binancefuture.com
    queue_drop_warning_every: 100
    queue_maxsize: 1000
    reconnect_sleep_seconds: 5
    verification_sleep_seconds: 10
    warmup_threshold_ms: 300000
    warmup_timeout_seconds: 600
postgres:
  database: flipper_db
  host: localhost
  password: flipperpass
  pool:
    max_size: 10
    min_size: 2
  port: 5432
  user: flipper
valkey:
  uri: redis://localhost:6379/0
