    open_time_spacing_hours: 12
    request_since_inclusive: true
    request_until_exclusive: true
    adapter_limit: 1000
    max_calls_per_asset: 1

atr:
  method: wilder_rma
  period: 14
  seed: sma
  common_start_index: 28

normalization:
  history_days: 365
  buckets: [Q1, Q2, Q3, Q4]
  rank: deterministic_midrank

calibration:
  prior_alpha: 0.5
  prior_beta: 0.5
  external_precision: sqrt_successes_plus_failures
  history_days: 365

outcome:
  first_touch_offset_bars: 1
  touch_search_bars: 50
  horizon_bars: 10
  control_side_order: [SUPPORT, RESISTANCE]
  label_rule: paired_excess_quality_atr_strictly_greater_than_zero
  label_availability_rule: last_closed_outcome_bar_strictly_before_prediction

folds:
  - {name: 2025_q1, start: "2025-01-01T00:00:00Z", end: "2025-04-01T00:00:00Z"}
  - {name: 2025_q2, start: "2025-04-01T00:00:00Z", end: "2025-07-01T00:00:00Z"}
  - {name: 2025_q3, start: "2025-07-01T00:00:00Z", end: "2025-10-01T00:00:00Z"}
  - {name: 2025_q4, start: "2025-10-01T00:00:00Z", end: "2026-01-01T00:00:00Z"}

bootstrap:
  draws: 10000
  generator: numpy.random.Generator
  bit_generator: PCG64
  seed: 2303
  resampling: cohort_fold_cells_then_cases_within_selected_cells
  interval: central_90_percent

dispositions:
  - ADAPTIVE_CONTEXT_SUPPORTED_FOR_SHADOW
  - ADAPTIVE_CONTEXT_NOT_SUPPORTED
  - INSUFFICIENT_CALIBRATION_EVIDENCE

artifact:
  output_root: research/tmp_sr_v2_3
  source_members: [manifest.json, TAOUSDT_1d.json, ETHUSDT_1d.json, SOLUSDT_1d.json, TAOUSDT_12h.json, ETHUSDT_12h.json, SOLUSDT_12h.json]
  evaluation_members: [manifest.json, study.json, cases.json, predictions.json]
