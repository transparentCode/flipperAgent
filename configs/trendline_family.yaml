version: 1

model:
  enabled: true
  model_version: trendline_family_v1

defaults:
  candidate:
    pivot_provider: fractal
    fitter: pathfinding
    lookback_bars: 240
    min_bars: 40
    fractal_left_bars: 3
    fractal_right_bars: 3
    min_pivots_per_side: 2
    min_candidate_quality: 0.35
    birth_quality_threshold: 0.45
  matching:
    normalization_atr_window: 14
    max_distance_atr: 0.75
    max_slope_delta_atr_per_hour: 0.10
    minimum_match_score: 0.60
    level_weight: 0.45
    slope_weight: 0.30
    anchor_weight: 0.15
    role_weight: 0.10
  lifecycle:
    active_grace_bars: 3
    dormant_after_bars: 6
    expire_after_bars: 50
    confidence_decay_per_unmatched_bar: 0.05
    reactivation_min_score: 0.70
    max_active_families_per_role: 8
  interaction:
    atr_window: 14
    tolerance_atr: 0.25
    approaching_distance_atr: 0.75
    minimum_zone_ticks: 1
    close_confirmation_bars: 2
  events:
    pressure_min_bars: 3
    rejection_recovery_bars: 2
    retest_window_bars: 6
    retest_confirmation_bars: 1
  rails:
    max_group_slope_delta_atr_per_hour: 0.08
    max_adjacent_gap_atr: 0.75
    max_corridor_width_atr: 1.50
    minimum_spacing_atr: 0.05
    representative_policy: stable_medoid
  mtf:
    enabled: false
    source_timeframes: []
    minimum_confluence_timeframes: 2
    max_source_age_bars: 4.0
    stale_include_age_bars: 1.0
    max_level_distance_atr: 0.75
    max_corridor_separation_atr: 0.75
    max_slope_delta_atr_per_hour: 0.10
    intersection_horizon_bars: 24
    normalization_policy: decision_timeframe_atr
  ranking: {}
  repository: {}
  runtime: {}

timeframes:
  15m:
    candidate:
      lookback_bars: 320
    lifecycle:
      expire_after_bars: 96
  4h:
    candidate:
      lookback_bars: 180
    lifecycle:
      expire_after_bars: 60

assets:
  BTCUSDT:
    defaults:
      candidate:
        birth_quality_threshold: 0.50
    timeframes:
      4h:
        matching:
          max_distance_atr: 0.65
        interaction:
          tolerance_atr: 0.22
