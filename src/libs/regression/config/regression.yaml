# Regression V2 — Reference Configuration
# All tiers populated with defaults extracted from v1 hardcoded values.
# Comments with [OPT:tier] mark optimization-tunable parameters.

orchestrator:
  mtf_timeframes: [4h, 1h, 30m]
  tf_weights:
    4h: 0.5
    1h: 0.3
    30m: 0.2
  regime_context_enabled: true
  regime_window_override: true  # allow regime.suggested_window to override window_size
  regime_window_defaults:
    CLEAN_TREND: 150
    VOLATILE_TREND: 60
    CHOPPY: 30
    QUIET_MR: 100

# ── Tier 1: Global Defaults ──
global:
  # Feature stack
  features:
    - name: log_price
    - name: volume_weighted
      params:
        volume_clip_pct: 95.0        # [OPT:global]
        weight_method: sqrt           # sqrt | log | linear

  # Method stack
  methods:
    theil_sen:
      enabled: true
      weight: 1.0                    # [OPT:per_tf]
      params:
        max_pairs: 300               # deterministic compute cap for subsampling
    vwr:
      enabled: true
      weight: 1.0                    # [OPT:per_tf]
      params:
        weight_strategy: volume_weighted

  # Ensemble
  ensemble:
    name: simple_weighted
    params:
      neutral_slope_atr_fraction: 0.04  # [OPT:global]

  # Uncertainty
  uncertainty:
    name: percentile_bands
    params:
      mad_scale_factor: 1.4826

  # ATR fractions — all thresholds are ATR-normalized
  atr_period: 14                     # [OPT:per_tf]
  trend_atr_fraction: 0.112          # [OPT:global] optimized 2026-05-16
  spread_atr_fraction: 0.210         # [OPT:global] optimized 2026-05-16
  momentum_atr_fraction: 0.146       # [OPT:global] optimized 2026-05-16
  neutral_slope_atr_fraction: 0.034  # [OPT:global] optimized 2026-05-16
  band_multiplier: 1.95              # [OPT:per_tf] optimized 2026-05-16

  # Window bounds
  min_window: 15
  max_window: 300
  default_window_size: 100

# ── Tier 2: Per-Timeframe Defaults ──
timeframes:
  4h:
    window_size: 150                 # [OPT:per_tf]
    slope_acceleration_alpha: 0.3
    methods:
      theil_sen:
        enabled: true
        weight: 1.0
      vwr:
        enabled: true
        weight: 1.0
    ensemble:
      name: confidence_weighted
      params:
        neutral_slope_atr_fraction: 0.04
        min_confidence: 0.05         # [OPT:per_tf]
        max_method_weight: 0.40      # [OPT:per_tf]
  1h:
    window_size: 73                  # [OPT:per_tf] optimized 2026-05-16
    slope_acceleration_alpha: 0.142  # [OPT:per_tf] optimized 2026-05-16
    methods:
      theil_sen:
        enabled: true
        weight: 0.458                # [OPT:per_tf] optimized 2026-05-16
      vwr:
        enabled: true
        weight: 1.010                # [OPT:per_tf] optimized 2026-05-16
  30m:
    window_size: 50                  # [OPT:per_tf]
    slope_acceleration_alpha: 0.3
    ensemble:
      name: confidence_weighted
      params:
        neutral_slope_atr_fraction: 0.04
        min_confidence: 0.05
        max_method_weight: 0.40

# ── Tier 3: Per-Asset-Class Overrides ──
asset_classes:
  crypto:
    volume_profile: continuous
    session_gap_handling: false
    low_liquidity_window_handling: false
  stock:
    volume_profile: session
    session_gap_handling: true
    low_liquidity_window_handling: false
    features:
      - name: log_price
      - name: volume_weighted
        params:
          volume_clip_pct: 95.0
          weight_method: sqrt
      - name: session_aware
  fx:
    volume_profile: proxy
    session_gap_handling: false
    low_liquidity_window_handling: true
    features:
      - name: log_price
      - name: volume_weighted
        params:
          volume_clip_pct: 90.0
          weight_method: log
      - name: session_aware

