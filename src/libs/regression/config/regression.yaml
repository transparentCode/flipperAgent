# ── Optimization Metadata ──
optimization:
  global_tunable:
    - trend_atr_fraction
    - spread_atr_fraction
    - momentum_atr_fraction
    - neutral_slope_atr_fraction
    - band_multiplier
  per_tf_tunable:
    - window_size
    - methods.theil_sen.weight
    - methods.vwr.weight
    - slope_acceleration_alpha
  per_asset_tunable:
    - window_size
    - ensemble.params
