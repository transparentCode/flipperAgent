# ──────────────────────────────────────────────────────────────
# Regression V2 MOTPE Optimization Config
# ──────────────────────────────────────────────────────────────
# Runtime-tunable values.  Structural constants live in constants.py.
# Load via: RegressionOptimizationConfig.from_yaml("path/to/this.yaml")

optimization:
  # ── MOTPE ──────────────────────────────────────────────────
  motpe:
    objectives:
      - weighted_direction_score
      - band_coverage_pct
      - confidence_sharpe
    meta_filter_strategy: harmonic_stability   # 'harmonic_stability' or 'orthogonal'
    meta_filter_metric: max_drawdown           # only used when strategy=orthogonal
    coverage_cap: 0.92                         # soft ceiling on band_coverage objective
    min_direction_floor: 0.42                  # MOTPE constraint (10th-pctl, keep loose)
    min_sharpe_floor: -2.0                     # MOTPE constraint (10th-pctl, keep loose)

  # ── Run settings ──────────────────────────────────────────
  n_trials: 200
  timeout_seconds: 3600
  n_jobs: 1               # >1 not thread-safe; keep at 1
  seed: 42                # Reproducible MOTPE sampling

  # ── Optimization tier ─────────────────────────────────────
  # "full" merges global + per_tf; or use "global", "per_tf", "per_asset"
  optimization_tier: full

  # ── Search space bounds ───────────────────────────────────
  param_bounds:
    window_size: [30, 200]
    band_multiplier: [1.5, 2.5]
    trend_atr_fraction: [0.05, 0.20]
    spread_atr_fraction: [0.08, 0.25]
    momentum_atr_fraction: [0.05, 0.20]
    neutral_slope_atr_fraction: [0.02, 0.08]
    slope_acceleration_alpha: [0.0, 0.5]
    methods.theil_sen.weight: [0.2, 2.0]
    methods.vwr.weight: [0.2, 2.0]

  param_types:
    window_size: int

  # ── Gate / constraint thresholds ──────────────────────────
  min_durbin_watson: 0.5
  min_confidence_rho: 0.01

  # ── 3-Way Walk-Forward ────────────────────────────────────
  train_bars: 4320          # 6 months @ 1h
  validate_bars: 720        # 1 month
  test_bars: 720            # 1 month
  step_bars: 720            # 1 month step
  purge_bars: 24            # 1 day @ 1h
  min_train_bars: 2160      # 3 months minimum
  max_train_ratio: 0.6      # Cap train at 60% of total
  expanding_window: false   # true = expanding train, false = fixed-size

  # ── Direction accuracy ────────────────────────────────────
  direction_horizons: [4, 12, 24]
  direction_horizon_weights: [0.5, 0.3, 0.2]

  # ── Aggregation ───────────────────────────────────────────
  worst_case_percentile: 10
  min_valid_results: 20
  max_failed_folds: 10
