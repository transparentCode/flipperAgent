# ──────────────────────────────────────────────────────────────
# Regression V2 MOTPE Optimization Config — Daily (1d) timeframe
# ──────────────────────────────────────────────────────────────
# Scaled walk-forward params for daily bars.
# Use with: --opt-config app/regression/optimization/config/optimization_daily.yaml

optimization:
  # ── MOTPE ──────────────────────────────────────────────────
  motpe:
    objectives:
      - weighted_direction_score
      - band_coverage_pct
      - confidence_sharpe
    meta_filter_strategy: harmonic_stability
    meta_filter_metric: max_drawdown
    coverage_cap: 0.92
    min_direction_floor: 0.42
    min_sharpe_floor: -2.0

  # ── Run settings ──────────────────────────────────────────
  n_trials: 200
  timeout_seconds: 3600
  n_jobs: 1
  seed: 42

  optimization_tier: full

  # ── Search space bounds ───────────────────────────────────
  param_bounds:
    window_size: [20, 120]
    band_multiplier: [1.5, 2.5]
    trend_atr_fraction: [0.05, 0.20]
    spread_atr_fraction: [0.08, 0.25]
    momentum_atr_fraction: [0.05, 0.20]
    neutral_slope_atr_fraction: [0.02, 0.08]
    slope_acceleration_alpha: [0.0, 0.5]
    methods.theil_sen.weight: [0.2, 2.0]
    methods.vwr.weight: [0.2, 2.0]

  param_types:
    window_size: int

  # ── Gate / constraint thresholds ──────────────────────────
  min_durbin_watson: 0.5
  min_confidence_rho: 0.01

  # ── 3-Way Walk-Forward (scaled for daily bars) ────────────
  train_bars: 365           # 1 year
  validate_bars: 180        # 6 months (must exceed max window_size=120 + buffer)
  test_bars: 180            # 6 months (must exceed max window_size=120 + buffer)
  step_bars: 60             # 2 month step
  purge_bars: 1             # 1 day gap
  min_train_bars: 180       # 6 months minimum
  max_train_ratio: 0.6
  expanding_window: false

  # ── Direction accuracy ────────────────────────────────────
  direction_horizons: [1, 3, 5]
  direction_horizon_weights: [0.5, 0.3, 0.2]

  # ── Aggregation ───────────────────────────────────────────
  worst_case_percentile: 10
  min_valid_results: 10
  max_failed_folds: 5
