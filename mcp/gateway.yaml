server:
  host: 0.0.0.0
  port: 9747
  # Large repo queries (e.g., architecture overview) can take a while; keep the
  # ceiling generous so the gateway does not kill legitimate long-running calls.
  request_timeout: 120s

meta_mcp:
  enabled: false

failsafe:
  health_check:
    enabled: true
    interval: 30s
    timeout: 10s

backends:
  cbm:
    command: "codebase-memory-mcp"
    description: "codebase-memory-mcp code intelligence for flipperAgent"
    timeout: 120s
    env:
      CBM_CACHE_DIR: "/data/cbm"
      CBM_LOG_LEVEL: "info"

  gitnexus:
    command: "gitnexus mcp"
    description: "GitNexus code intelligence for flipperAgent"
    timeout: 120s
