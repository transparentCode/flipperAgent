[project]
name = "flipperagent"
version = "0.1.0"
description = "A good quant research agent"
authors = [
    {name = "drDisrespect",email = "priyanshugupta221@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.0",
    "watchdog>=5.0.0",
    "pydantic>=2.0.0",
    "ccxt>=4.0.0",
    "binance-futures-connector>=3.0.0",
    "websockets>=11.0",
    "aiohttp>=3.0.0",
    "pandas>=2.0.0",
    "arq>=0.25.0",
    "valkey>=6.0.0",
    "asyncpg>=0.29.0",
    "aiofiles>=23.0.0",
    "tenacity>=8.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "numpy>=2.0.0",
    "numba>=0.60.0",
    "optuna>=3.0.0",
    "scipy>=1.17.0",
    "hmmlearn>=0.3.3",
    # OpenTelemetry
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
tv-scraper = [
    "patchright>=1.0.0",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "apps", from = "src" }, { include = "libs", from = "src" }]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests that require live data and take >1min",
]
