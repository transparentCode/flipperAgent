[project]
name = "flipperagent"
version = "0.1.0"
description = "A good quant research agent"
authors = [
    {name = "drDisrespect",email = "priyanshugupta221@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.0",
    "watchdog>=5.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "flipper_agent", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
